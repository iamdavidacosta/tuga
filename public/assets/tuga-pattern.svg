<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="360" height="360" viewBox="0 0 360 360"
     role="img" aria-labelledby="title desc">
  <title id="title">TUGA — patrón botánico sutil</title>
  <desc id="desc">Módulo vectorial repetible de hojas redondeadas, gotas y óvalos suaves en verdes de TUGA sobre un fondo crema cálido.</desc>
  <!-- Repetir sin separación mediante background-repeat: repeat; tile natural 360 x 360 -->
  <defs>
    <g id="sprig" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 41 Q -1 13 4 -10" stroke="#6B9A78" stroke-width="2.1" opacity=".36"/>
      <path d="M 2 23 C -13 21 -20 11 -16 -1 C -3 1 6 10 2 23 Z" fill="#A7C7A3" opacity=".57"/>
      <path d="M 3 10 C 18 6 23 -6 16 -13 C 4 -10 1 -1 3 10 Z" fill="#95B89A" opacity=".48"/>
      <path d="M 4 -5 C -3 -14 -2 -23 9 -30 C 13 -18 11 -10 4 -5 Z" fill="#B7CE9A" opacity=".49"/>
    </g>
    <g id="leaflet">
      <path d="M -19 2 C -14 -15 6 -21 21 -7 C 12 13 -4 17 -19 2 Z" fill="#A5C5A4"/>
      <path d="M -10 5 Q 3 0 12 -7" stroke="#F5F8EB" stroke-width="1.5" fill="none" opacity=".45" stroke-linecap="round"/>
    </g>
    <g id="rounded-pair">
      <rect x="0" y="0" width="31" height="11" rx="5.5" fill="#EECFAD"/>
      <circle cx="44" cy="4" r="6.5" fill="#B5D1A1"/>
    </g>
  </defs>

  <!-- El color base es intencionalmente claro para tarjetas y pantallas -->
  <rect width="360" height="360" fill="#FBF9F3"/>

  <!-- Hojas: poca densidad y bajo contraste para no competir con el contenido -->
  <use xlink:href="#sprig" transform="translate(77 87) rotate(-19) scale(1.02)" opacity=".35"/>
  <use xlink:href="#sprig" transform="translate(261 212) rotate(21) scale(.90)" opacity=".29"/>
  <use xlink:href="#sprig" transform="translate(103 292) rotate(-46) scale(.80)" opacity=".26"/>
  <use xlink:href="#leaflet" transform="translate(279 61) rotate(-30) scale(.82)" opacity=".20"/>
  <use xlink:href="#leaflet" transform="translate(185 154) rotate(142) scale(.68)" opacity=".21"/>

  <!-- Gotas y pastillas orgánicas, en los tonos suaves de la identidad TUGA -->
  <ellipse cx="191" cy="48" rx="18" ry="10" fill="#DDECBF" opacity=".28" transform="rotate(-25 191 48)"/>
  <ellipse cx="330" cy="139" rx="12" ry="7" fill="#E7D5BD" opacity=".24" transform="rotate(24 330 139)"/>
  <rect x="35" y="199" width="29" height="11" rx="5.5" fill="#BBD3AF" opacity=".16" transform="rotate(-28 35 199)"/>
  <rect x="190" y="302" width="40" height="14" rx="7" fill="#DBE9C4" opacity=".23" transform="rotate(20 190 302)"/>
  <circle cx="153" cy="232" r="6" fill="#CEDEB5" opacity=".30"/>
  <circle cx="324" cy="302" r="8" fill="#EEDBBE" opacity=".22"/>
  <circle cx="35" cy="27" r="5.5" fill="#B9D4AD" opacity=".21"/>
  <circle cx="225" cy="106" r="4" fill="#B0CAA5" opacity=".21"/>

  <!-- Suaves siluetas abstractas adicionales -->
  <path d="M 132 112 C 145 102 156 110 155 122 C 153 131 138 133 132 123 C 130 119 130 115 132 112 Z"
        fill="#D7E8C8" opacity=".18"/>
  <path d="M 306 253 C 314 245 324 247 328 255 C 332 264 322 274 314 270 C 306 268 302 259 306 253 Z"
        fill="#EBD9C1" opacity=".18"/>
</svg>
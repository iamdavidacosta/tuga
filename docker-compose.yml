services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    init: true
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_AUTH_REDIRECT_URL: "${VITE_AUTH_REDIRECT_URL:-http://localhost:5173/auth/callback}"
      VITE_SUPABASE_PUBLISHABLE_KEY: "${VITE_SUPABASE_PUBLISHABLE_KEY:-}"
      VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:-}"
      VITE_VAPID_PUBLIC_KEY: "${VITE_VAPID_PUBLIC_KEY:-}"
    volumes:
      - .:/app
      - tuga_node_modules:/app/node_modules

volumes:
  tuga_node_modules:
